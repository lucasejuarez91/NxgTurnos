<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Incluir el header -->
<th:block th:replace="~{fragments/header :: head}"></th:block>
<script th:src="@{/js/company/edit.js}"></script>
<body>
<th:block th:replace="~{fragments/header :: header}"></th:block>
<div>
    <th:block th:replace="~{fragments/breadcrumbs :: listbreacrumbs}"></th:block>
    <div class="page-header" id="banner">
        <div class="row">
            <div class="card">
                <div class="card-body">
                    <div class="row">
                        <div class="col-12 col-lg-6">
                            <label for="name" class="form-label mt-4">Nombre</label>
                            <input type="text" class="form-control" id="name" th:value="${company.name}">
                        </div>
                        <div class="col-12 col-lg-6">
                            <label for="description" class="form-label mt-4">Descripción</label>
                            <textarea type="text" class="form-control" id="description" th:text="${company.description}"></textarea>
                        </div>
                        <div class="col-12 col-lg-6">
                            <label for="address" class="form-label mt-4">Dirección</label>
                            <input type="text" class="form-control" id="address" th:value="${company.address}"></input>
                            <iframe id="google-map" src="" width="150" height="112" frameborder="0" style="border:0" allowfullscreen></iframe>
                        </div>
                        <div class="col-12 col-lg-6">
                            <label for="telephone" class="form-label mt-4">Teléfono</label>
                            <input type="text" class="form-control" id="telephone" th:value="${company.telephone}"></input>
                        </div>
                        <div class="col-12 col-lg-6">
                            <label for="contact" class="form-label mt-4">Contacto</label>
                            <input type="text" class="form-control" id="contact" th:value="${company.contact}"></input>
                        </div>
                        <div class="col-12 col-lg-6">
                            <label for="minStartTime" class="form-label mt-4">Hora Apertura</label>
                            <input type="time" class="form-control" id="minStartTime" th:value="${company.minStartTime}"></input>
                        </div>
                        <div class="col-12 col-lg-6">
                            <label for="maxEndtime" class="form-label mt-4">Hora Cierre</label>
                            <input type="time" class="form-control" id="maxEndtime" th:value="${company.maxEndtime}"></input>
                        </div>
                    </div>
                    <br>
                    <div class="row">
                        <div class="col-lg-12 col-12 ms-auto d-flex justify-content-end">
                            <button class="btn btn-success btnUpdate" type="button" th:data-id="${company.id}">Actualizar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
