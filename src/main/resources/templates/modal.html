<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="modal fade" id="modalCreate" tabindex="-1" role="dialog"
     data-bs-keyboard="false" data-bs-backdrop="static" aria-hidden="true" th:fragment="simpleModal(title)">
    <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title text-uppercase" th:text="${title}" id="modalTitle"></h5>
            </div>
            <div class="modal-body"></div>
            <div class="modal-footer">
                <div class="col-lg-12 col-12 ms-auto d-flex justify-content-start">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>
</div>
