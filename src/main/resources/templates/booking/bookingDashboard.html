<div class="row" th:fragment="totalizers" id="totalizers">
    <div th:class="${appt.apptStatus == appt.apptStatus.IN_PROGRESS ? 'offset-2 col-md-2 badge' : 'offset-3 col-md-2'}">
        <div class="card info-card revenue-card badge-xl bg-info">
            <div class="card-body">
                <h5 class="card-title">Total</h5>
                <div class="d-flex align-items-center">
                    <div class="card-icon rounded-circle d-flex align-items-center justify-content-center">
                        <i class="bi bi-currency-dollar"></i>
                    </div>
                    <div class="ps-3">
                        <h6 th:text="${total}">$3,000</h6>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-2">
        <div class="card info-card revenue-card badge-xl bg-success">
            <div class="card-body">
                <h5 class="card-title">Pagado</h5>
                <div class="d-flex align-items-center">
                    <div class="card-icon rounded-circle d-flex align-items-center justify-content-center">
                        <i class="bi bi-currency-dollar"></i>
                    </div>
                    <div class="ps-3">
                        <h6 th:text="${totalPayed}">$100</h6>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-2">
        <div th:class="${'card info-card revenue-card badge-xl ' + (totalPending > 0 ? 'bg-danger' : '') }">
            <div class="card-body">
                <h5 class="card-title">Pendiente</h5>
                <div class="d-flex align-items-center">
                    <div class="card-icon rounded-circle d-flex align-items-center justify-content-center">
                        <i class="bi bi-currency-dollar"></i>
                    </div>
                    <div class="ps-3">
                        <h6 th:text="${totalPending}">$2,900</h6>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-2 align-content-center" th:if="${appt.apptStatus == appt.apptStatus.IN_PROGRESS}">
        <form th:action="@{'/booking/closeBooking'}" method="POST">
            <button class="card info-card revenue-card text-center badge bg-danger" type="submit">
                <div class="container p-3">
                    <div>
                        <div class="ps-3">
                            <h6 class="text-white">CERRAR TURNO</h6>
                            <input type="hidden" name="apptCode" th:value="${appt.code}">
                        </div>
                    </div>
                </div>
            </button>
        </form>
    </div>
</div>
