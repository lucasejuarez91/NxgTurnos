<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Incluir el header -->
<th:block th:replace="~{fragments/header :: head}"></th:block>
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
<script th:src="@{/js/professionals/availability.js}"></script>
<body>
<th:block th:replace="~{fragments/header :: header}"></th:block>

<div>
    <th:block th:replace="~{fragments/breadcrumbs :: listbreacrumbs}"></th:block>
    <div class="page-header" id="banner">
        <div class="row">
            <div class="card">
                <div class="card-body">
                    <form th:action="@{./save}" method="post">
                        <h5 class="card-title">Asignar disponibilidad</h5>
                        <div class="row">
                            <div class="col-12 col-lg-4">
                                <div class="col-12 col-lg-12">
                                    <!-- Selección de Profesional -->
                                    <div class="mb-3">
                                        <label for="fullname" class="form-label">Profesional</label>
                                        <input type="text" class="form-control" id="fullname" th:value="${professional.firstname + ' ' + professional.lastname}" disabled>
                                        <input type="hidden" class="form-control" name="profesionalId" id="profesionalId" th:value="${professional.id}">
                                    </div>
                                </div>
                                <div class="col-12 col-lg-8">
                                    <div class="mb-3">
                                        <label for="dayOfWeek" class="form-label">Día de la Semana</label>
                                        <select id="dayOfWeek" name="dayOfWeek" class="form-select" required>
                                            <option value="MONDAY">Lunes</option>
                                            <option value="TUESDAY">Martes</option>
                                            <option value="WEDNESDAY">Miércoles</option>
                                            <option value="THURSDAY">Jueves</option>
                                            <option value="FRIDAY">Viernes</option>
                                            <option value="SATURDAY">Sábado</option>
                                            <option value="SUNDAY">Domingo</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-12 col-lg-12">
                                    <div class="col-12 col-lg-6">
                                        <!-- Horario de Inicio -->
                                        <div class="mb-3">
                                            <label for="startTime" class="form-label">Hora de Inicio</label>
                                            <input type="time" id="startTime" name="startTime" class="form-control" required>
                                        </div>
                                    </div>
                                    <div class="col-12 col-lg-6">
                                        <!-- Horario de Fin -->
                                        <div class="mb-3">
                                            <label for="endTime" class="form-label">Hora de Fin</label>
                                            <input type="time" id="endTime" name="endTime" class="form-control" required>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-12 col-lg-8">
                                <div id="calendar"></div>
                            </div>
                        </div>
                        <!-- Botón para agregar disponibilidad -->
                        <button type="submit" class="btn btn-primary">Asignar</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Disponibilidad</h5>
                    <table class="display table-stripped" style="width:100%" id="tblAvailability">
                        <thead>
                        <tr>
                            <th scope="col">Día</th>
                            <th>Hora Inicio</th>
                            <th>Hora Fin</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="availability: ${availabilities}">
                            <td th:text="${availability.translate(availability.dayOfWeek)}"></td>
                            <td th:text="${availability.startTime}"></td>
                            <td th:text="${availability.endTime}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
