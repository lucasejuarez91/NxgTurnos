<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- modalCreate.html -->
<div>
  <div class="row">
    <div class="col-12 col-lg-6">
      <label for="firstname" class="form-label mt-4">Nombre</label>
      <input type="text" class="form-control" id="firstname">
    </div>
    <div class="col-12 col-lg-6">
      <label for="lastname" class="form-label mt-4">Apellido</label>
      <input type="text" class="form-control" id="lastname">
    </div>
    <div class="col-12 col-lg-6">
        <label for="specialities" class="form-label mt-4">Especialidad</label>
        <select class="form-select" id="specialities" multiple>
          <option th:each="speciality : ${specialities}"
                  th:value="${'/specialityService/' + speciality.id}"
                  th:text="${speciality.name}">
          </option>
        </select>
    </div>
    <div class="col-12 col-lg-6">
      <label for="telephone" class="form-label mt-4">Teléfono</label>
      <input type="text" class="form-control" id="telephone">
    </div>
  </div>
  <br>
  <div class="row">
    <div class="col-lg-12 col-12 ms-auto d-flex justify-content-end">
      <button class="btn btn-success" type="button" th:onclick="manageEntity('professionals')">Crear</button>
    </div>
  </div>
</div>
