<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Incluir el header -->
<th:block th:replace="~{fragments/header :: head}"></th:block>
<script th:src="@{/js/appointments/edit.js}"></script>
<body>
<th:block th:replace="~{fragments/header :: header}"></th:block>
<div>
    <th:block th:replace="~{fragments/breadcrumbs :: listbreacrumbs}"></th:block>
    <div class="page-header" id="banner">
        <div class="row">
            <div class="card">
                <div class="card-body">
                    <div class="row">
                        <div class="col-12 col-lg-5">
                            <h3 class="card-title" th:text="${'Turno #' + appointment.code}"></h3>
                            <div class="col-12 col-lg-12">
                                <label for="companyLbl" class="form-label mt-4">Salón</label>
                                <input type="text" class="form-control" id="companyLbl" th:value="${appointment.company.name}" th:data-min="${appointment.company.minStartTime}" th:data-max="${appointment.company.maxEndtime}" readonly>
                                <input type="hidden" id="bkg" th:value="${appointment.id}">
                            </div>
                            <div class="col-12 col-lg-12">
                                <label for="service" class="form-label mt-4">Servicio</label>
                                <select class="form-select" id="service">
                                    <option value="" disabled selected>Seleccione una opción...</option>
                                    <option th:each="service : ${services}"
                                            th:value="${'/service/' + service.id}"
                                            th:text="${service.name + ' - $' + service.price}"
                                            th:selected="${#arrays.contains(services, appointment.service)}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-12 col-lg-12">
                                <label for="professional" class="form-label mt-4">Profesional</label>
                                <select class="form-select" id="professional">
                                    <option value="" disabled selected>Seleccione una opción...</option>
                                    <option th:each="professional : ${professionals}"
                                            th:data-id="${professional.id}"
                                            th:value="${'/professionals/' + professional.id}"
                                            th:text="${professional.getFullname()}"
                                            th:selected="${#arrays.contains(professionals, appointment.professional)}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-12 col-lg-12">
                                <label for="scheduledDate" class="form-label mt-4">Fecha y Hora</label>
                                <input type="datetime-local" step="2" class="form-control" id="scheduledDate" th:value="${appointment.scheduledDateStart}" readonly>
                                <input type="hidden" class="form-control" id="apptStatus" name="apptStatus" value="'/appointmentStatus/1'">
                            </div>
                        </div>
                        <div class="col-12 col-lg-7">
                            <div id="calendar" class="mt-3"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
