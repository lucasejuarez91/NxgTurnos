<div class="modal fade" id="qrTurnoModal" tabindex="-1" style="display: none;" aria-hidden="true" th:fragment="modalQR">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" th:text="#{title.qr}">QR Turno</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="qrcode"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" th:text="#{title.close}">Cerrar</button>
            </div>
        </div>
    </div>
</div>
