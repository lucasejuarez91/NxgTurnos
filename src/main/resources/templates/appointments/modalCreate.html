<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- modalCreate.html -->
<div>
  <div class="row">
    <div class="col-12 col-lg-6">
        <input type="hidden" id="company" th:value="${actualCompany}">
        <label for="client" class="form-label mt-4">Cliente</label>
        <select class="form-select" id="client">
          <option value="" disabled selected>Seleccione una opción...</option>
          <option th:each="client : ${clients}"
                  th:value="${'/clients/' + client.id}"
                  th:text="${client.getFullname() + ' - ' + client.getEmail()}">
          </option>
        </select>
    </div>
    <div class="col-12 col-lg-6">
      <label for="service" class="form-label mt-4">Servicio</label>
      <select class="form-select" id="service">
        <option value="" disabled selected>Seleccione una opción...</option>
        <option th:each="service : ${services}"
                th:value="${'/service/' + service.id}"
                th:text="${service.name + ' - $' + service.price}">
        </option>
      </select>
    </div>
    <div class="col-12 col-lg-6">
      <label for="professional" class="form-label mt-4">Profesional</label>
      <select class="form-select" id="professional">
        <option value="" disabled selected>Seleccione una opción...</option>
        <option th:each="professional : ${professionals}"
                th:value="${'/professionals/' + professional.id}"
                th:text="${professional.getFullname()}">
        </option>
      </select>
    </div>
    <div class="col-12 col-lg-6">
      <label for="scheduledDate" class="form-label mt-4">Fecha y Hora</label>
      <input type="datetime-local" step="2" class="form-control" id="scheduledDate">
      <input type="hidden" class="form-control" id="apptStatus" value="'/appointmentStatus/1'">
    </div>
  </div>
  <br>
  <div class="row">
    <div class="col-lg-12 col-12 ms-auto d-flex justify-content-end">
      <button class="btn btn-success" type="button" th:onclick="manageEntity('appointments')">Crear</button>
    </div>
  </div>
</div>
