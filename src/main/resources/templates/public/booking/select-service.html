<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Incluir el header -->
<th:block th:replace="~{fragments/header :: head}"></th:block>
<body>
<th:block th:replace="~{fragments/header :: header}"></th:block>
<div>
    <div class="page-header" id="banner">
        <div class="row">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title text-center fs-1" th:text="#{title.services.list}">Listado de Servicios</h5>
                    <div class="row">
                        <th:block th:insert="~{/public/booking/summary :: summaryDiv}"></th:block>
                        <div class="col-md-6">
                            <div class="card mb-3" style="border: 1px solid lightgray; height: auto;">
                                <div class="row g-0">
                                    <div class="col-md-12">
                                        <div class="container">
                                            <div class="row" th:each="catServ : ${categoryServices}">
                                                <div class="col-12">
                                                    <h5 class="card-title" th:text="${catServ.name}"></h5>
                                                    <div class="row align-items-center mb-2 mt-2" style="justify-content: space-between; background-color: #d3d3d357;" th:each="serv : ${catServ.services}">
                                                        <div class="col-md-3 col-lg-6 col-xs-12">
                                                            <span class="fw-bold" th:text="${serv.name}"></span>
                                                            <br>
                                                            <small class="text-muted" th:text="${serv.description}"></small>
                                                        </div>
                                                        <div class="col-md-3 col-6 fw-bold text-primary" th:text="${'$ ' + serv.price}"></div>
                                                        <div class="col-md-3 col-6 text-end">
                                                            <a class="btn btn-outline-primary btn-sm" th:href="@{'/booking/request/select-professional/' + ${serv.id} }" th:text="#{title.book}">RESERVAR</a>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
