<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Incluir el header -->
<th:block th:replace="~{fragments/header :: head}"></th:block>
<body>
<th:block th:replace="~{fragments/header :: header}"></th:block>
<div>
    <div class="page-header" id="banner">
        <div class="row">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title text-center fs-1" th:text="#{title.professionals.list}">Listado de Profesionales</h5>
                    <div class="row">
                        <th:block th:insert="~{/public/booking/summary :: summaryDiv}"></th:block>
                        <div class="col-md-6">
                            <div class="card mb-3">
                                <div class="row g-0">
                                    <div class="col-md-12">
                                        <div class="container">
                                            <div class="row">
                                                <div class="col-12">
                                                    <h5 class="card-title" th:text="#{title.available.professionals}">Profesionales disponibles</h5>
                                                    <div class="row align-items-center m-2" style="justify-content: space-between;" th:each="prof : ${professionals}">
                                                        <div class="alert alert-light alert-dismissible fade show" role="alert">
                                                            <a class="fw-bold" th:text="${prof.fullname}" th:href="@{'/booking/request/select-date/' + ${prof.id} }"></a>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
