<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Incluir el header -->
<th:block th:replace="~{fragments/header :: head}"></th:block>
<body>
<th:block th:replace="~{fragments/public/header :: header}"></th:block>
<div>
    <div class="page-header" id="banner">
        <div class="row">
            <div class="card">
                <div class="card-body">
                    <div class="row">
                        <div class="offset-2 col-2">
                            <div class="card mb-3">
                                <div class="row g-0">
                                    <div class="card-body">
                                        <h5 class="card-title">Resumen</h5>
                                        <div class="row">
                                            <div class="col-12">
                                                <label class="text-muted">Salón</label>
                                                <br>
                                                <span th:text="${appt.company.name}" id="companyLbl"></span>
                                            </div>
                                        </div>
                                        <div class="row" th:if="${appt.service != null}">
                                            <div class="col-12">
                                                <label class="text-muted">Servicios</label>
                                                <br>
                                                <span th:text="${appt.service != null ? appt.service.name : '' }"></span>
                                            </div>
                                        </div>
                                        <div class="row" th:if="${appt.professional != null}">
                                            <div class="col-12">
                                                <label class="text-muted">Profesional</label>
                                                <br>
                                                <span th:text="${appt.professional.fullname}" id="professionalLbl" th:data-professionalId="${appt.professional.id}"></span>
                                            </div>
                                        </div>
                                        <div class="row" th:if="${appt.professional != null}">
                                            <div class="col-12">
                                                <label class="text-muted">Horario</label>
                                                <br>
                                                <span th:text="${appt.scheduledDateStart}"></span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
