<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- modalCreate.html -->
<div>
  <div class="row">
    <div class="col-12 col-lg-6">
        <label for="categoryService" class="form-label mt-4">Categoría</label>
        <select class="form-select" id="categoryService">
          <option value="" disabled selected>Seleccione una opción...</option>
          <option th:each="category : ${categories}"
                  th:value="${'/categoryService/' + category.id}"
                  th:text="${category.name}">
          </option>
        </select>
    </div>
    <div class="col-12 col-lg-6">
      <label for="name" class="form-label mt-4">Nombre del Servicio</label>
      <input type="text" class="form-control" id="name">
    </div>
  </div>
  <div class="row">
    <div class="col-12 col-lg-12">
      <label for="description" class="form-label mt-4">Descripción</label>
      <textarea class="form-control" id="description"></textarea>
    </div>
  </div>
  <div class="row">
    <div class="col-12 col-lg-6">
      <label for="price" class="form-label mt-4">Valor</label>
      <input type="currency" class="form-control" id="price">
    </div>
    <div class="col-12 col-lg-6">
      <label for="duration" class="form-label mt-4">Duración (<small>en minutos</small>)</label>
      <input type="text" class="form-control changed" id="duration" value="30">
    </div>
  </div>
  <br>
  <div class="row">
    <div class="col-lg-12 col-12 ms-auto d-flex justify-content-end">
      <button class="btn btn-success" type="button" th:onclick="manageEntity('services')">Crear</button>
    </div>
  </div>
</div>
