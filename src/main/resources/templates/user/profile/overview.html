<div class="tab-pane fade show active profile-overview" id="profile-overview" th:fragment="overwiew">

    <h5 class="card-title" th:text="#{title.profile.details}">Profile Details</h5>

    <div class="row">
        <div class="col-lg-3 col-md-4 label" th:text="#{title.profile.fullname}">Full Name</div>
        <div class="col-lg-9 col-md-8">[[${user.fullname}]]</div>
    </div>

    <div class="row" th:if="${loggedUser != null && actualCompany != null}">
        <div class="col-lg-3 col-md-4 label" th:text="#{title.lounge}">Company</div>
        <div class="col-lg-9 col-md-8">[[${actualCompany.name}]]</div>
    </div>

    <div class="row">
        <div class="col-lg-3 col-md-4 label" th:text="#{title.phone}">Phone</div>
        <div class="col-lg-9 col-md-8">[[${user.phone}]]</div>
    </div>

    <div class="row">
        <div class="col-lg-3 col-md-4 label" th:text="#{title.email}">Email</div>
        <div class="col-lg-9 col-md-8">[[${user.email}]]</div>
    </div>

</div>
